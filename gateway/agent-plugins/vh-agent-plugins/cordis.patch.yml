# v-harness carrier bundle: mounts the image's unpublished agent-side tool
# plugins as the last profile bundle layer. The gateway copies the plugin
# packages into the profile's node_modules and appends this bundle to
# dsh.profile.bundles before dsh starts (gateway/plugins.mjs); the packages
# this bundle depends on are what make dsh's profile-scope resolution carry
# the row plugins at all.
#
# Row ids mirror the rows in packages/bundle/base/cordis.patch.yml. If a
# future dsh release publishes these rows in dsh-base itself, delete the
# duplicates here so the plugins are not mounted twice.

- insert:
    # Tenant capability transport. The gateway writes `capabilities.json` into
    # DSH_HOME only after this plugin is in the image and only for capabilities
    # it has stopped serving itself; without that file the plugin mounts
    # nothing, so an old gateway or a rollback keeps its own sockets.
    - id: vh-capabilities
      name: '@deepseek-ai/dsh-host-vh-capabilities'

    # Local generation service; off until a deployment names an endpoint
    # (the gateway forwards IMAGE_STUDIO_BASE_URL only when it is set).
    - id: skill-image-studio
      name: '@deepseek-ai/dsh-skill-image-studio'
      disabled: !!js "!process.env.IMAGE_STUDIO_BASE_URL && !process.env.IMAGE_STUDIO_AUTH_FILE"

    # PhotoCraft photo editing. The capability endpoint has a working default
    # (the VOS app's storage service), so this row mounts by default and only an
    # explicit opt-out removes it; the tools hold no credential — the gateway
    # fronts the tenant's own capability socket.
    - id: skill-photocraft
      name: '@deepseek-ai/dsh-skill-photocraft'
      disabled: !!js "!!process.env.VH_PHOTOCRAFT_OFF"

    # AI-album has no tool row: its photo grid only ever rendered inside the
    # Turn's folded "thinking" process, while the output area is owned by
    # `present` deliverables. The flow ships as a plain skill (skills/album)
    # whose CLI the model runs and presents with — the channel a reader sees.

    # `ui-tool-cards`, `ui-user-questions` and `ui-knowledge` are mounted by the
    # web-app bundle itself (packages/bundle/web-app/cordis.patch.yml). Inserting
    # them here too duplicates the loader entry id and fails the profile load.

    # The composer's `@` source over the user's own V-Office folder. Published
    # nowhere, so nothing in the dependency graph names it: gateway/plugins.mjs
    # creates the profile copy and this row is what mounts it.
    - id: ui-voffice
      name: '@deepseek-ai/dsh-client-ui-voffice'

    # The tenant services panel: list, open, stop and restart the web services
    # the tenant registered through the gateway's vh-services capability.
    - id: ui-services
      name: '@deepseek-ai/dsh-client-ui-services'

    # The MCPHub service panel. Hidden by not being mounted: the gateway sets
    # VH_MCPHUB only when a probe of the sibling MCPHub container answers, so a
    # platform without that application serves no bundle and shows no entry.
    - id: ui-mcphub
      name: '@deepseek-ai/dsh-client-ui-mcphub'
      disabled: !!js "!process.env.VH_MCPHUB"

    # MCPHub's MCP surface as the Agent sees it. The URL names the gateway, not
    # MCPHub: the key in `authorization` resolves to this tenant, and only the
    # gateway holds the VOS token that signs the upstream request. One
    # connection carries every visible service, so nothing here needs to know
    # which services exist — unless the tenant chose services, in which case
    # the gateway's generated overlay mounts one client per service and sets
    # VH_MCPHUB_SELECT to retire this row.
    - id: mcp-mcphub
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js "!process.env.VH_MCPHUB || !!process.env.VH_MCPHUB_SELECT"
      config:
        transport: streamable-http
        serverName: mcphub
        # `smart` asks MCPHub's vector router for a per-request tool subset; it
        # only answers in database mode, so the default stays the discovery
        # endpoint that carries every visible tool.
        url: !!js "process.env.VH_MCPHUB_ENDPOINT + (process.env.VH_MCPHUB_ROUTING === 'smart' ? '/$smart' : '/mcp')"
        headers: !!js "({ authorization: 'Bearer ' + process.env.VH_MCPHUB_KEY })"
        toolCallTimeoutMs: 120000
