- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: ui-settings-models
  config:
    credentialOnboarding: false
    schedulerManaged: true
- id: ui-settings-account
  config:
    # VOS 部署的登录由网关的 OIDC 免登录完成，页面内不需要 DeepSeek 账号登录入口。
    hideSignIn: true
- id: workspace-controller
  config:
    documentsDirectory: !!js process.env.HOME + '/workspace'
# The answer language follows the tenant's VOS interface language. A patch
# replaces the whole config, so the prefix the web-app bundle sets is restated
# here instead of being dropped; without a known language both templates stay
# as they were.
- id: system-prompt
  config:
    personaPrefix: 'You are a coding agent powered by the {{model}} model.'
    personaSuffix: !!js "process.env.VH_USER_LOCALE === 'en' ? 'Always answer in English unless the user writes in another language.' : process.env.VH_USER_LOCALE === 'zh' ? '始终用简体中文回答，除非用户明确使用其他语言。' : ''"
