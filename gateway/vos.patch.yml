- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: ui-settings-models
  config:
    credentialOnboarding: false
    schedulerManaged: true
- id: ui-settings-account
  config:
    # VOS 部署的登录由网关的 OIDC 免登录完成，页面内不需要 DeepSeek 账号登录入口。
    hideSignIn: true
- id: workspace-controller
  config:
    documentsDirectory: !!js process.env.HOME + '/workspace'
# The vh-jail private tmpfs root is already the tenant boundary: sibling homes,
# /data and /root do not exist in it. A patch replaces the whole config, so the
# mode/root the base bundle sets are restated here.
# `workspaceRoot` is the whole tenant home, not `<home>/workspace`. npm, pnpm,
# pip, uv and cargo all write to `~/.npm`, `~/.cache`, `~/.local` before they
# write a single project file: with the narrower root, every session that
# installed a dependency first had to rediscover this and hand-set cache
# directories. The jail hides every other tenant, so widening the writable root
# inside one's own home costs nothing.
# `tenantRoot` is "/" because the whole private root belongs to this tenant.
# Pointing it at the home makes bwrap add --tmpfs masks for /home, /root, /data,
# /srv, /mnt and /media; none of those exist in the jail, and bwrap cannot
# create mount points under its own read-only root. The jail already hides them,
# so the masks are redundant. "/" keeps the bwrap dev-bind and /tmp bind while
# leaving the mask list empty.
- id: sandbox-policy
  config:
    mode: !!js "process.env.DSH_PERMISSION_MODE ?? 'workspace-write'"
    workspaceRoot: !!js "process.env.HOME ?? process.cwd()"
    tenantRoot: "/"
# VOS full access opts a single session into the operations tool. Its
# filesystem and shell keep the workspace-write boundary.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      vos-full-access:
        sandbox: workspace-write
        approval: ask
        sessionOnly: true
        name: !!js "process.env.VH_USER_LOCALE === 'en' ? 'Full access (VOS operations)' : '完全访问（VOS 运维）'"
        description: !!js "process.env.VH_USER_LOCALE === 'en' ? 'Enable the VOS operations tool for this session after administrator authorization. Each write requires separate confirmation.' : '管理员授权后为当前会话开启 VOS 运维工具，写操作仍需逐项确认。'"
# The answer language follows the tenant's VOS interface language. A patch
# replaces the whole config, so the prefix the web-app bundle sets is restated
# here instead of being dropped; without a known language both templates stay
# as they were.
- id: system-prompt
  config:
    personaPrefix: 'You are a coding agent powered by the {{model}} model.'
    personaSuffix: !!js "process.env.VH_USER_LOCALE === 'en' ? 'Always answer in English unless the user writes in another language.' : process.env.VH_USER_LOCALE === 'zh' ? '始终用简体中文回答，除非用户明确使用其他语言。' : ''"
- id: plugin-manager
  config:
    fallbackRegistries: []
