- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: ui-settings-models
  config:
    credentialOnboarding: false
    schedulerManaged: true
- id: ui-settings-account
  config:
    # VOS 部署的登录由网关的 OIDC 免登录完成，页面内不需要 DeepSeek 账号登录入口。
    hideSignIn: true
- id: workspace-controller
  config:
    documentsDirectory: !!js process.env.HOME + '/workspace'
# The terminal sandbox hides every other account's tree. `tenantRoot` is this
# account's own root as the jailed process sees it; the provider masks the
# sibling homes and the state root, so even a deployment that loses its jail
# never exposes another tenant. A patch replaces the whole config, so the
# mode/root the base bundle sets are restated here.
# `workspaceRoot` is the whole tenant home, not `<home>/workspace`. npm, pnpm,
# pip, uv and cargo all write to `~/.npm`, `~/.cache`, `~/.local` before they
# write a single project file: with the narrower root, every session that
# installed a dependency first had to rediscover this and hand-set cache
# directories. The isolation boundary is `tenantRoot` — a sibling home still
# does not exist in this jail — so widening the writable root inside one's own
# home costs nothing.
- id: sandbox-policy
  config:
    mode: !!js "process.env.DSH_PERMISSION_MODE ?? 'workspace-write'"
    workspaceRoot: !!js "process.env.HOME ?? process.cwd()"
    tenantRoot: !!js "process.env.HOME ?? '/data'"
# A tenant may pick read-only or workspace-write in General settings, never
# danger-full-access: one click must not be able to turn the sandbox off.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
# The answer language follows the tenant's VOS interface language. A patch
# replaces the whole config, so the prefix the web-app bundle sets is restated
# here instead of being dropped; without a known language both templates stay
# as they were.
- id: system-prompt
  config:
    personaPrefix: 'You are a coding agent powered by the {{model}} model.'
    personaSuffix: !!js "process.env.VH_USER_LOCALE === 'en' ? 'Always answer in English unless the user writes in another language.' : process.env.VH_USER_LOCALE === 'zh' ? '始终用简体中文回答，除非用户明确使用其他语言。' : ''"
- id: dsh-market
  config:
    region: china
- id: plugin-manager
  config:
    fallbackRegistries: ['https://registry.npmjs.org/']
