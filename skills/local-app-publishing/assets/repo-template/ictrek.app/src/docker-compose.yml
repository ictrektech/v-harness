x-myapp-base: &myapp-base
  restart: unless-stopped
  environment:
    LOG_LEVEL: ${MYAPP_LOG_LEVEL:-info}
  volumes:
    - ${VOS_APP_STORAGE_PATH}/data:/data
  networks:
    vos_default:
      aliases:
        - myapp
  labels:
    - "traefik.enable=true"
    - "traefik.docker.network=vos_default"
    - "traefik.http.routers.myapp.entrypoints=web,web-internal"
    - "traefik.http.routers.myapp.rule=PathPrefix(`/app/com.example.myapp`)"
    - "traefik.http.routers.myapp.middlewares=myapp-strip"
    - "traefik.http.middlewares.myapp-strip.stripprefix.prefixes=/app/com.example.myapp"
    - "traefik.http.services.myapp.loadbalancer.server.port=80"

services:
  myapp-amd:
    <<: *myapp-base
    profiles: ["amd"]
    image: local/myapp:__APP_VERSION__
    pull_policy: never

  myapp-arm:
    <<: *myapp-base
    profiles: ["arm"]
    image: local/myapp:__APP_VERSION__
    pull_policy: never

networks:
  vos_default:
    external: true
