name: local-build

# 在 Gitea 里构建离线包并发布 Release。workflow 只用 shell，不用任何 Node action：
# 子路径部署下 actions/checkout 会拼出缺 /app/com.ictrek.gitea 的克隆地址。
#
# 发布规则：
#   - 推送 tag（v*）→ 发布该 tag 的 Release。
#   - 推送 main → 读 VERSION，发布 v<VERSION>。
# 构建需要 docker CLI。没有时只校验应用定义，不发布 Release。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    # 平台自带 runner：job 容器挂了宿主 docker socket，但没有 docker CLI。
    runs-on: ubuntu-latest
    env:
      # auto：有可用 docker 就构建；1：强制构建；0：只校验应用定义（如 GARM 的 LXD runner）。
      VOS_BUILD: 'auto'
    steps:
      - name: clone
        run: |
          # GITEA_BASE overrides the runner-registered Gitea address.
          base="${GITEA_BASE:-${GITHUB_SERVER_URL:-http://gitea:8080/app/com.ictrek.gitea}}"
          base="${base%/}"
          echo "[INFO] gitea base: $base (GITHUB_SERVER_URL=${GITHUB_SERVER_URL:-<unset>})"
          case "$base" in
            https://*) scheme=https; host="${base#https://}" ;;
            http://*)  scheme=http;  host="${base#http://}" ;;
            *)         scheme=http;  host="$base" ;;
          esac
          url="$scheme://x-access-token:${{ github.token }}@$host/${{ github.repository }}.git"
          git clone --depth 1 "$url" src \
            || { echo "[ERROR] clone failed from $base; set GITEA_BASE to a reachable Gitea address" >&2; exit 1; }
          printf '%s' "$base" > /tmp/gitea-base
          echo "[INFO] cloned from $base"

      - name: ensure docker
        run: |
          docker_ok() { command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; }

          # Return the fastest URL by measured throughput.
          speed_of() { curl -sL -o /dev/null -r 0-500000 --max-time 6 -w '%{speed_download}' "$1" 2>/dev/null | cut -d. -f1; }
          fastest() {
            local best="$1" best_speed=0 url speed
            for url in "$@"; do
              speed=$(speed_of "$url")
              [ -n "$speed" ] || speed=0
              if [ "$speed" -gt "$best_speed" ]; then
                best="$url"
                best_speed="$speed"
              fi
            done
            printf '%s' "$best"
          }

          arch=$(uname -m)
          case "$arch" in
            x86_64|amd64) arch=x86_64 ;;
            aarch64|arm64) arch=aarch64 ;;
          esac

          # Install the docker CLI from a static tarball.
          install_static() {
            [ "$(id -u)" = "0" ] || return 1
            command -v curl >/dev/null 2>&1 || return 1
            local url
            url=$(fastest \
              "https://mirrors.aliyun.com/docker-ce/linux/static/stable/${arch}/docker-27.3.1.tgz" \
              "https://download.docker.com/linux/static/stable/${arch}/docker-27.3.1.tgz")
            echo "[INFO] docker CLI <- $url"
            curl -fsSL --retry 2 -m 180 "$url" -o /tmp/docker-cli.tgz \
              && tar -xzf /tmp/docker-cli.tgz -C /tmp \
              && install -m 0755 /tmp/docker/docker /usr/local/bin/docker
          }

          # Install docker.io with apt.
          install_apt() {
            local apt sed mirror
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              apt="sudo apt-get"; sed="sudo sed"
            elif [ "$(id -u)" = "0" ]; then
              apt=apt-get; sed=sed
            else
              return 1
            fi
            mirror=$(fastest \
              "http://mirrors.aliyun.com/debian/dists/bookworm/Release" \
              "http://deb.debian.org/debian/dists/bookworm/Release")
            mirror=${mirror#http://}
            mirror=${mirror%%/*}
            echo "[INFO] docker.io <- apt ${mirror}"
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
              if [ -f "$f" ]; then $sed -i "s|deb.debian.org|${mirror}|g" "$f"; fi
            done
            timeout 600 $apt -o Acquire::Retries=2 update -qq \
              && timeout 900 $apt install -y -qq --no-install-recommends docker.io >/dev/null
          }

          docker_ok || install_static || install_apt || true
          if docker_ok; then
            docker version --format 'server={{.Server.Version}}'
            exit 0
          fi
          echo "[WARN] no usable docker; build will be skipped" >&2
          exit 0

      - name: build
        run: |
          build() {
            bash src/ictrek.app/scripts/package-local.sh
            ls -l src/dist
          }
          validate() {
            # icon.png is generated by package-local.sh.
            for file in manifest.yml docker-compose.yml configs.yml routers.yml; do
              [ -f "src/ictrek.app/src/$file" ] || { echo "[ERROR] missing ictrek.app/src/$file" >&2; exit 1; }
            done
            echo "[INFO] app definition validated ($1); no package built"
          }
          case "${VOS_BUILD:-auto}" in
            0) validate "VOS_BUILD=0" ;;
            1) build ;;
            *)
              if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
                build
              else
                validate "docker unavailable"
              fi
              ;;
          esac

      - name: publish tag and release
        run: |
          auth="Authorization: token ${{ github.token }}"
          api="$(cat /tmp/gitea-base)/api/v1/repos/$GITHUB_REPOSITORY"

          # 1) A tag push keeps its own tag; a main push uses VERSION.
          case "$GITHUB_REF" in
            refs/tags/*) tag="$GITHUB_REF_NAME" ;;
            *)
              version="$(tr -d ' \t\r\n' < src/VERSION)"
              [ -n "$version" ] || { echo "[ERROR] VERSION is empty" >&2; exit 1; }
              tag="v$version"
              ;;
          esac
          echo "[INFO] publishing tag $tag"

          # 2) Skip when no package was built.
          pkg="$(ls src/dist/*-*.tar 2>/dev/null | head -n1)"
          if [ -z "$pkg" ]; then
            echo "[WARN] no built package; skip tag and release"
            exit 0
          fi

          # 3) Create the tag at this commit when it does not exist yet.
          if [ "$(curl -s -o /dev/null -w '%{http_code}' -H "$auth" "$api/tags/$tag")" != "200" ]; then
            curl -sf -X POST "$api/tags" -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"$tag\",\"target\":\"$GITHUB_SHA\"}" -o /tmp/tag.json \
              || { echo "[ERROR] tag create failed" >&2; exit 1; }
            echo "[INFO] created tag $tag"
          fi

          # 4) Reuse an existing Release.
          if ! curl -sf -H "$auth" "$api/releases/tags/$tag" -o /tmp/release.json; then
            curl -sf -X POST "$api/releases" -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"$tag\",\"name\":\"$tag\",\"prerelease\":false,\"draft\":false}" -o /tmp/release.json \
              || { echo "[ERROR] release create failed" >&2; exit 1; }
          fi

          # 5) Take only the first "id": author and assets in the release JSON carry "id" too.
          id="$(grep -o '"id":[0-9][0-9]*' /tmp/release.json | head -n1 | cut -d: -f2)"
          [ -n "$id" ] || { echo "[ERROR] release id missing" >&2; cat /tmp/release.json; exit 1; }

          # 6) Delete same-name assets; the list comes from the release JSON.
          name="$(basename "$pkg")"
          assets_json="$(sed -n 's/.*"assets":\(\[.*\]\).*/\1/p' /tmp/release.json)"
          ids="$(printf '%s' "${assets_json:-[]}" | sed 's/},{/}\n{/g' \
                 | grep -F "\"name\":\"$name\"" \
                 | sed -n 's/.*"id":\([0-9][0-9]*\).*/\1/p')" || true
          for aid in $ids; do
            curl -sf -X DELETE -H "$auth" "$api/releases/$id/assets/$aid" \
              && echo "[INFO] removed old asset $name (id=$aid)"
          done

          # 7) Upload the outer package.
          curl -sf -X POST "$api/releases/$id/assets?name=$name" \
            -H "$auth" -H 'Content-Type: application/octet-stream' \
            --data-binary @"$pkg" -o /tmp/asset.json \
            || { echo "[ERROR] asset upload failed" >&2; exit 1; }
          echo "[INFO] published $name to release $tag"

      - name: install to vos
        # 上传刚打好的包并安装到本机 VOS；缺凭据或没出包时脚本只警告并跳过。
        env:
          VOS_GATEWAY: ${{ secrets.VOS_GATEWAY }}
          VOS_ADMIN_USER: ${{ secrets.VOS_ADMIN_USER }}
          VOS_ADMIN_PASSWORD: ${{ secrets.VOS_ADMIN_PASSWORD }}
          VOS_VOLUME: ${{ secrets.VOS_VOLUME }}
          VOS_VOLUME_ID: ${{ secrets.VOS_VOLUME_ID }}
          VOS_PROFILES: ${{ secrets.VOS_PROFILES }}
        run: |
          bash src/ictrek.app/scripts/install-to-vos.sh
