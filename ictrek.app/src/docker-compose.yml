x-v-harness-env: &v-harness-env
  PORT: 8080
  DATA_ROOT: /data
  APP_BASE_PATH: /app/com.ictrek.v-harness
  VOS_OIDC_CLIENT_ID: com.ictrek.v-harness
  VOS_OIDC_SCOPE: openid profile email
  VOS_OIDC_USERINFO_URL: ${VOS_OIDC_USERINFO_URL:-http://172.17.0.1:8105/v1000/oauth2/userinfo}
  # 内部直连：image-studio 后端与 v-harness 同在 vos_default 网络，按服务名解析，
  # 每台服务器一致；v-office 存储在宿主机 5000（走 docker 网桥）；AI 相册在独立
  # compose 网络，经 VOS 网关的 /app 路径（172.17.0.1 是 docker 默认网桥地址，同样与机器无关）。
  IMAGE_STUDIO_BASE_URL: ${IMAGE_STUDIO_BASE_URL:-http://image-studio-backend:5000}
  VH_OFFICE_BASE: ${VH_OFFICE_BASE:-http://v-office-storage:5000}
  VH_ALBUM_URL: ${VH_ALBUM_URL:-http://172.17.0.1:1182/app/com.ictrek.ai-album/api}
  # 知识库（HybRAG / com.ictrek.hybrag）与 v-harness 同在 vos_default 网络，
  # 按 compose 别名直连后端 8080（容器内端口，不是宿主机映射的 29081），
  # 不经过 VOS 网关的 /app 前缀，也就少一次 strip 转发。
  WEKNORA_URL: ${WEKNORA_URL:-http://hybrag-app:8080}
  # MCPHub（com.ictrek.mcphub）同样在 vos_default 网络，按 compose 别名直连容器
  # 3000；它的 BASE_PATH 由自己保留，不经 VOS 网关，因此不做 strip。
  MCPHUB_URL: ${MCPHUB_URL:-http://mcphub:3000/app/com.ictrek.mcphub}
  SESSION_TTL_MS: ${SESSION_TTL_MS:-43200000}
  DSH_PERMISSION_MODE: workspace-write
  # Docker Hub is not reachable from these hosts: `registry-1.docker.io` and
  # `auth.docker.io` resolve to unrelated addresses (185.60.216.36, 199.59.149.231)
  # and every pull times out. Tenants pull through the host daemon, so the
  # mirror belongs in that daemon's `/etc/docker/daemon.json`, not here.
  NODE_ENV: production

x-v-harness-base: &v-harness-base
  restart: unless-stopped
  environment: *v-harness-env
  # bin/vh-jail needs mount, pid and ipc namespaces so one tenant cannot see
  # another tenant's home, processes or shm; CAP_SYS_ADMIN covers the namespace
  # syscalls and the jail mounts. Tenants share the container network by design;
  # CAP_NET_ADMIN lets vh-jail install per-tenant iptables owner rules that
  # keep one tenant off the loopback ports of another (no /dev/net/tun needed:
  # no per-tenant namespace or user-space forwarder is involved).
  cap_add:
    - SYS_ADMIN
    - SYS_PTRACE
    - NET_ADMIN
  security_opt:
    - seccomp:unconfined
    - apparmor:unconfined
  volumes:
    - ${VOS_APP_STORAGE_PATH}/data:/data
    # The tenant Docker capability. The gateway holds the host socket and hands
    # each tenant a filtered Unix socket of its own (gateway/docker-proxy.mjs);
    # the jail never sees this file, so a tenant cannot create a privileged
    # container or mount the host. The mount is still a trust-boundary change:
    # the socket is host root by another name, so root inside *this* container
    # is root on the host. That is the same trade agent-room makes.
    - /var/run/docker.sock:/var/run/docker.sock
  networks:
    vos_default:
      aliases:
        - v-harness
  labels:
    - "traefik.enable=true"
    - "traefik.docker.network=vos_default"
    # Both entrypoints are declared here rather than left to the provider's
    # per-entry point derivation: the public HTTPS ingress (`web`) is how the VOS
    # portal opens this application, and a route that only exists because a
    # platform build derives it is a route nobody can see in the deployment.
    - "traefik.http.routers.v-harness-app.entrypoints=web,web-internal"
    - "traefik.http.routers.v-harness-api.entrypoints=web,web-internal"
    - "traefik.http.routers.v-harness-ref.entrypoints=web,web-internal"
    # Application entry: strip the VOS prefix, hand the SPA shell to dsh.
    - "traefik.http.routers.v-harness-app.rule=PathPrefix(`/app/com.ictrek.v-harness`)"
    - "traefik.http.routers.v-harness-app.service=v-harness"
    - "traefik.http.routers.v-harness-app.middlewares=v-harness-strip"
    - "traefik.http.middlewares.v-harness-strip.stripprefix.prefixes=/app/com.ictrek.v-harness"
    # dsh's SPA uses absolute paths, so these reach the gateway at the root.
    # Referer pins them to this application.
    - "traefik.http.routers.v-harness-api.rule=(PathPrefix(`/api`) || PathPrefix(`/plugins`) || PathPrefix(`/assets`) || PathPrefix(`/__vh`) || Path(`/favicon.ico`)) && (HeaderRegexp(`Referer`, `/app/com\\.ictrek\\.v-harness/`) || PathPrefix(`/__vh`))"
    - "traefik.http.routers.v-harness-api.priority=1300"
    - "traefik.http.routers.v-harness-api.service=v-harness"
    # A plugin serving its own routes (`/dsh-gitea/config`) issues them at the
    # root, where no path prefix identifies the application. The Referer still
    # does: it is the workspace page that made the call. Catch those requests
    # here so they reach the gateway instead of the platform's 404 — this holds
    # even when the injected bridge could not run.
    - "traefik.http.routers.v-harness-ref.rule=HeaderRegexp(`Referer`, `/app/com\\.ictrek\\.v-harness/`)"
    - "traefik.http.routers.v-harness-ref.priority=1200"
    - "traefik.http.routers.v-harness-ref.service=v-harness"
    - "traefik.http.services.v-harness.loadbalancer.server.port=8080"
  healthcheck:
    test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/__vh/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
    interval: 30s
    timeout: 10s
    start_period: 60s
    retries: 3

services:
  v-harness-amd:
    <<: *v-harness-base
    profiles: ["amd"]
    image: ${V_HARNESS_AMD_IMAGE}
    pull_policy: always
    mem_limit: ${V_HARNESS_MEM_LIMIT:-8g}
    cpus: ${V_HARNESS_CPU_LIMIT:-4}

  v-harness-arm:
    <<: *v-harness-base
    profiles: ["arm"]
    image: ${V_HARNESS_ARM_IMAGE}
    pull_policy: always
    mem_limit: ${V_HARNESS_MEM_LIMIT:-8g}
    cpus: ${V_HARNESS_CPU_LIMIT:-4}

networks:
  vos_default:
    external: true
